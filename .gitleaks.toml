title = "HomeCraft secret detection"
minVersion = "v8.30.1"

[extend]
useDefault = true

# 唯一例外：registry.rs 的 cfg(test) binding() 固定测试密码。
# 必须同时匹配规则、文件和完整初始化行；不得按目录或整文件排除。
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Exact cfg(test) Pairing fixture in registry.rs; no production credentials"
condition = "AND"
paths = ['''(?:^|/)software/mac-app/src/registry\.rs$''']
regexTarget = "line"
regexes = ['''^\s*password: "1234567890abcdef1234567890abcdef"\.into\(\),$''']
