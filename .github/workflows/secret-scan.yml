name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: '要检查的提交或发布标签'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  secrets:
    name: Gitleaks and upload boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/homecraft-security-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/homecraft-security-bin" gitleaks
          echo "$RUNNER_TEMP/homecraft-security-bin" >> "$GITHUB_PATH"
      - name: Test secret blocking with isolated fixtures
        run: python3 -m unittest discover -s software/tests -p 'test_*git*.py' -v
      - name: Scan source, staged bytes and full Git history (redacted)
        run: python3 software/tools/check_secrets.py
