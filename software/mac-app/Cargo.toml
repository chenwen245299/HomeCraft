[package]
name = "epaper-ble"
version = "0.3.4"
edition = "2024"
description = "HomeCraft macOS connected home companion"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
btleplug = "0.13.5"
chrono = "0.4"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu"] }
libc = "0.2"
log = "0.4"
epaper-macos = { path = "native" }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
num-bigint = "0.4"
prost = "0.14"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tray-icon = "0.24"
uuid = "1"
zeroize = "1"
zstd = { version = "0.13", default-features = false }
zip = { version = "9", default-features = false }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

# Build-time procedural macro dylibs need their metadata on macOS. They are not bundled.
[profile.release.build-override]
strip = "none"
